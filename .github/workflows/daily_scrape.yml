name: Daily MND Scrape & Auto Update

on:
  schedule:
    # 每天台灣時間上午 10:00 (UTC 02:00) 自動執行爬蟲
    - cron: '0 2 * * *'
  workflow_dispatch: # 支援在 GitHub 網頁上「一鍵手動觸發」執行
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/**'

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run MND Scraper
        run: |
          python mnd_scraper.py 5

      - name: Commit and Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add records.json records.js
          if git diff --staged --quiet; then
            echo "No updates found from MND website."
          else
            git commit -m "chore: auto-update MND military records [skip ci]"
            git push
          fi
