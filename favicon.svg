  <text x="50" y="96" font-family="sans-serif" font-weight="900" font-size="8" fill="#7FB5A0" text-anchor="middle">S</text>
  <text x="94" y="53" font-family="sans-serif" font-weight="900" font-size="8" fill="#5b6b7c" text-anchor="middle">E</text>
  <text x="6" y="53" font-family="sans-serif" font-weight="900" font-size="8" fill="#5b6b7c" text-anchor="middle">W</text>
